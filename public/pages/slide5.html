<div id="navbar-placeholder"></div>

<script>
    fetch('../components/navbar.html')
        .then(res => res.text())
        .then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;

            // Reinitialize menu after navbar loads
            if (typeof initSlidesMenuOverlay === 'function') {
                initSlidesMenuOverlay();
            }
            if (typeof initMobileMenu === 'function') {
                initMobileMenu();
            }
        });
</script>
